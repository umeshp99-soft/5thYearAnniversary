<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Leaderboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container py-4 py-md-5">
  <header class="text-center mb-4">
    <div class="badge rounded-pill text-bg-warning mb-3">LIVE</div>
    <h1 class="display-5 fw-bold">🏆 Quiz Leaderboard</h1>
    <p class="text-muted mb-0">Auto-refreshes every 5 seconds</p>
  </header>

  <section class="card quiz-card">
    <div class="card-body p-3 p-md-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <strong id="lastUpdated">Loading...</strong>
        <button id="refreshBtn" class="btn btn-outline-primary btn-sm">↻ Refresh</button>
      </div>
      <div class="table-responsive">
        <table class="table align-middle leaderboard-table mb-0">
          <thead>
            <tr><th>#</th><th>Participant</th><th>Office</th><th>Score</th><th>Time</th></tr>
          </thead>
          <tbody id="leaderboardBody">
            <tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
async function loadLeaderboard() {
  const body = document.getElementById("leaderboardBody");
  try {
    const response = await getLeaderboard();
    if (!response.success) throw new Error(response.message || "Unable to load leaderboard.");
    const rows = response.data || [];
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No completed quizzes yet.</td></tr>';
    } else {
      body.innerHTML = rows.slice(0, 50).map((r, i) => {
        const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1);
        return `<tr><td class="fw-bold">${medal}</td><td class="fw-semibold">${escapeHtml(r.name)}</td><td>${escapeHtml(r.office || "-")}</td><td><strong>${r.score}/${r.total}</strong></td><td>${escapeHtml(r.timeText || "-")}</td></tr>`;
      }).join("");
    }
    document.getElementById("lastUpdated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) {
    body.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">${escapeHtml(e.message)}</td></tr>`;
  }
}
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
document.getElementById("refreshBtn").addEventListener("click", loadLeaderboard);
loadLeaderboard();
setInterval(loadLeaderboard, 5000);
</script>
</body>
</html>
