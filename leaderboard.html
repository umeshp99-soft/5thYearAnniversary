<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Results</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><main class="container py-4 py-md-5"><header class="text-center mb-4"><div class="badge rounded-pill text-bg-warning mb-3">5TH ANNIVERSARY</div><h1 class="display-6 fw-bold">🏆 Round Results</h1><p class="text-muted">For organizer/display use.</p></header><section class="card quiz-card"><div class="card-body p-4"><select id="round" class="form-select form-select-lg mb-4"></select><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Rank</th><th>Participant</th><th>Office</th><th>Score</th><th>Time</th></tr></thead><tbody id="body"><tr><td colspan="5" class="text-center">Loading...</td></tr></tbody></table></div></div></section></main><script src="js/config.js"></script><script src="js/api.js"></script><script>const s=document.getElementById('round');CONFIG.ROUNDS.forEach(r=>{const o=document.createElement('option');o.value=r.name;o.textContent=r.name;s.appendChild(o)});async function load(){const r=await getLeaderboard(s.value);const b=document.getElementById('body');b.innerHTML=(r.data||[]).map(x=>`<tr><td><strong>#${x.rank}</strong></td><td>${esc(x.name)}</td><td>${esc(x.office||'-')}</td><td><strong>${x.score}/${x.total}</strong></td><td>${esc(x.timeText)}</td></tr>`).join('')||'<tr><td colspan="5" class="text-center text-muted">No results yet.</td></tr>'}s.onchange=load;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}load();</script></body></html>
