<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organizer Results</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container py-4 py-md-5">
<div class="card quiz-card mx-auto">
<div class="card-body p-4 p-md-5">
<h1 class="h3 mb-3">🏆 Organizer Results</h1>
<p class="text-muted">Admin PIN required. This page is not a participant leaderboard.</p>

<div class="row g-3">
<div class="col-md-5">
<input id="pin" type="password" class="form-control form-control-lg" placeholder="Organizer PIN">
</div>
<div class="col-md-4">
<select id="round" class="form-select form-select-lg">
<option>Round 1</option>
<option>Round 2</option>
<option>Round 3</option>
<option>Final</option>
</select>
</div>
<div class="col-md-3">
<button id="loadBtn" class="btn btn-primary btn-lg w-100">Load</button>
</div>
</div>

<div id="message" class="mt-3"></div>

<div class="table-responsive mt-4">
<table class="table">
<thead>
<tr>
<th>Rank</th><th>Name</th><th>Office</th><th>Score</th><th>Time</th>
</tr>
</thead>
<tbody id="body">
<tr><td colspan="5" class="text-center text-muted">Enter PIN.</td></tr>
</tbody>
</table>
</div>

</div>
</div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById("loadBtn").onclick = async () => {
  const pin = document.getElementById("pin").value.trim();
  const round = document.getElementById("round").value;
  const body = document.getElementById("body");
  const msg = document.getElementById("message");

  if (!pin) {
    msg.innerHTML = '<div class="alert alert-danger">Enter organizer PIN.</div>';
    return;
  }

  body.innerHTML =
    '<tr><td colspan="5" class="text-center">Loading...</td></tr>';

  try {
    const r = await getAdminResults(pin, round);
    if (!r.success) throw Error(r.message);

    body.innerHTML = (r.data || []).map(x => `
      <tr>
        <td><strong>#${x.rank}</strong></td>
        <td>${esc(x.name)}</td>
        <td>${esc(x.office || "-")}</td>
        <td><strong>${x.score}/${x.total}</strong></td>
        <td>${esc(x.timeText || "")}</td>
      </tr>
    `).join("") || '<tr><td colspan="5" class="text-center text-muted">No results.</td></tr>';

  } catch (e) {
    body.innerHTML =
      `<tr><td colspan="5" class="text-center text-danger">${esc(e.message)}</td></tr>`;
  }
};

function esc(v) {
  return String(v ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );
}
</script>
</body>
</html>
