<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Organizer Control</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><main class="container py-4 py-md-5"><header class="text-center mb-4"><div class="badge rounded-pill text-bg-warning mb-3">ORGANIZER</div><h1 class="display-6 fw-bold">🏆 Knockout Quiz Control</h1><p class="text-muted">Review each round and activate the next round for the qualifiers.</p></header><section class="card quiz-card mx-auto"><div class="card-body p-4 p-md-5"><div class="row g-3 align-items-end mb-4"><div class="col-md-4"><label class="form-label">Organizer PIN</label><input id="pin" type="password" class="form-control form-control-lg" placeholder="Enter PIN"></div><div class="col-md-4"><label class="form-label">Round Results</label><select id="round" class="form-select form-select-lg"></select></div><div class="col-md-4"><button id="refreshBtn" class="btn btn-outline-primary btn-lg w-100">↻ Refresh</button></div></div><div id="message"></div><div class="d-flex justify-content-between align-items-center mb-2"><strong id="roundSummary"></strong><span id="qualifierText" class="badge text-bg-info"></span></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Select</th><th>Rank</th><th>Participant</th><th>Office</th><th>Score</th><th>Time</th></tr></thead><tbody id="resultsBody"><tr><td colspan="6" class="text-center text-muted">Enter PIN and refresh.</td></tr></tbody></table></div><button id="activateBtn" class="btn btn-warning btn-lg w-100 mt-3">⭐ Activate Selected for Next Round</button><p class="small text-muted mt-3 mb-0">Select the qualifiers according to the ranking. Tie-break: highest score first, then fastest time.</p></div></section></main><script src="js/config.js"></script><script src="js/api.js"></script><script>
let rows=[];const roundSel=document.getElementById('round');CONFIG.ROUNDS.forEach((r,i)=>{const o=document.createElement('option');o.value=r.name;o.textContent=`${r.name} → top ${r.qualifiers}`;roundSel.appendChild(o);});roundSel.value='Round 1';
async function load(){const pin=document.getElementById('pin').value.trim(),round=roundSel.value,body=document.getElementById('resultsBody');body.innerHTML='<tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>';try{const r=await getAdminResults(pin,round);if(!r.success)throw Error(r.message);rows=r.data||[];const idx=CONFIG.ROUNDS.findIndex(x=>x.name===round),next=CONFIG.ROUNDS[idx+1];document.getElementById('roundSummary').textContent=`${round}: ${rows.length} completed`;document.getElementById('qualifierText').textContent=next?`Select ${next.qualifiers} for ${next.name}`:'Final completed';if(!rows.length){body.innerHTML='<tr><td colspan="6" class="text-center text-muted">No completed results yet.</td></tr>';return;}body.innerHTML=rows.map((x,i)=>`<tr><td>${next?`<input class="form-check-input participant-check" type="checkbox" data-i="${i}">`:''}</td><td><strong>#${x.rank}</strong></td><td class="fw-semibold">${esc(x.name)}</td><td>${esc(x.office||'-')}</td><td><strong>${x.score}/${x.total}</strong></td><td>${esc(x.timeText)}</td></tr>`).join('');}catch(e){rows=[];body.innerHTML=`<tr><td colspan="6" class="text-center text-danger">${esc(e.message)}</td></tr>`;}}
document.getElementById('refreshBtn').onclick=load;roundSel.onchange=load;document.getElementById('activateBtn').onclick=async()=>{const pin=document.getElementById('pin').value.trim(),idx=CONFIG.ROUNDS.findIndex(x=>x.name===roundSel.value),next=CONFIG.ROUNDS[idx+1],msg=document.getElementById('message');if(!next){msg.innerHTML='<div class="alert alert-info">Final is the last round.</div>';return;}const selected=[...document.querySelectorAll('.participant-check:checked')].map(x=>rows[Number(x.dataset.i)]).filter(Boolean);if(!pin||!selected.length){msg.innerHTML='<div class="alert alert-danger">Enter PIN and select participants.</div>';return;}if(selected.length!==next.qualifiers){msg.innerHTML=`<div class="alert alert-danger">Please select exactly ${next.qualifiers} participants for ${next.name}.</div>`;return;}try{const r=await activateRound(selected.map(x=>x.email),pin,next.name);if(!r.success)throw Error(r.message);msg.innerHTML=`<div class="alert alert-success">${esc(r.message)}</div>`;await load();}catch(e){msg.innerHTML=`<div class="alert alert-danger">${esc(e.message)}</div>`;}};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
</script></body></html>
