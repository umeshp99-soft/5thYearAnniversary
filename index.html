<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5th Anniversary Mega Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container py-4 py-md-5">
  <header class="text-center mb-4">
    <div class="badge rounded-pill text-bg-warning mb-3">5 YEARS • 5 ROUNDS • ONE CHAMPION</div>
    <h1 class="display-5 fw-bold">🎉 5th Anniversary Mega Quiz</h1>
    <p class="lead text-muted">Fun • Fast • Competitive</p>
  </header>

  <section id="loginSection" class="card quiz-card mx-auto">
    <div class="card-body p-4 p-md-5">
      <h2 class="h4 text-center mb-4">Choose Your Name</h2>
      <label for="employeeSelect" class="form-label">Participant</label>
      <select id="employeeSelect" class="form-select form-select-lg mb-3">
        <option value="">Loading participants...</option>
      </select>
      <div id="loginError" class="alert alert-danger d-none"></div>
      <button id="startBtn" class="btn btn-primary btn-lg w-100" disabled>🚀 Start Quiz</button>
      <p class="small text-muted text-center mt-3 mb-0">One attempt per participant.</p>
    </div>
  </section>

  <section id="quizSection" class="d-none">
    <div class="quiz-topbar card quiz-card mb-3">
      <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div>
          <div class="small text-muted">Player</div>
          <strong id="playerName"></strong>
        </div>
        <div class="text-center">
          <div class="small text-muted">Question</div>
          <strong><span id="questionNumber">1</span>/<span id="totalQuestions">20</span></strong>
        </div>
        <div class="timer-box">
          <span>⏱️</span> <strong id="timer">20</strong>s
        </div>
      </div>
    </div>

    <div class="progress mb-3" style="height:8px">
      <div id="progressBar" class="progress-bar" role="progressbar" style="width:5%"></div>
    </div>

    <article class="card quiz-card">
      <div class="card-body p-4 p-md-5">
        <div class="small text-uppercase text-muted mb-2" id="roundLabel">Round 1</div>
        <h2 id="questionText" class="h3 mb-4"></h2>
        <div id="options" class="d-grid gap-3"></div>
        <div class="d-flex justify-content-end mt-4">
          <button id="nextBtn" class="btn btn-primary btn-lg" disabled>Next →</button>
        </div>
      </div>
    </article>
  </section>

  <section id="resultSection" class="d-none">
    <div class="card quiz-card text-center">
      <div class="card-body p-4 p-md-5">
        <div class="display-2">🏆</div>
        <h2 class="mb-2">Quiz Completed!</h2>
        <p class="text-muted mb-4">Great job, <strong id="resultName"></strong>.</p>
        <div class="score-panel">
          <div class="score-number" id="resultScore">0</div>
          <div class="text-muted">out of <span id="resultTotal">20</span></div>
        </div>
        <div class="mt-4" id="submissionStatus"></div>
        <a href="leaderboard.html" class="btn btn-warning btn-lg mt-3">🏆 View Leaderboard</a>
      </div>
    </div>
  </section>

  <footer class="text-center text-muted small mt-4">
    5th Anniversary Celebration • Fun Committee
  </footer>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
